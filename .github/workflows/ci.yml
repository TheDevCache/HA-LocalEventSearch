name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install aiohttp pytest pytest-asyncio
      - run: pytest -q

  windows-app:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r windows/requirements.txt pyinstaller
      - run: python windows/build.py
      - name: Smoke test the .exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath windows\dist\LocalEventScout.exe -ArgumentList '--self-test','--report','selftest.txt' -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: LocalEventScout-windows
          path: windows/dist/LocalEventScout.exe
